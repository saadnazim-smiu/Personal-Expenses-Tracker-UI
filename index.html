<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="brand-header">
        <h1 class="brand">Personal Expense Tracker</h1>
    </header>

    <header class="top-nav">
        <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="hamburger" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
    </label>

        <nav class="nav-links" aria-label="Main navigation">
            <a href="signup.html">Signup</a>
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="income.html">Income</a>
            <a href="add-expense.html">Add Expense</a>
            <a href="expenses.html">Expenses</a>
            <a href="categories.html">Categories</a>
            <a href="monthly-report.html">Monthly Report</a>
            <a href="logout.html">Logout</a>
        </nav>
    </header>

    <main class="container">
        <div class="page-shell">

            <div class="auth-shell">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1>Sign Up</h1>
                        <p>Create your account</p>
                    </div>

                    <form>
                        <label for="name">Full Name</label>
                        <input id="name" type="text" name="name" placeholder="Enter your full name" required>

                        <label for="email">Email Address</label>
                        <input id="email" type="email" name="email" placeholder="Enter your email" required>

                        <label for="password">Password</label>
                        <input id="password" type="password" name="password" placeholder="Create a password" required>

                        <label for="confirm-password">Confirm Password</label>
                        <input id="confirm-password" type="password" name="confirm_password" placeholder="Confirm your password" required>

                        <button type="submit">Sign Up</button>
                    </form>

                    <p class="form-footer">
                        Already have an account?
                        <a href="login.html">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>

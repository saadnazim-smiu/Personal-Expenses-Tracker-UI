<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income | Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="brand-header">
        <h1 class="brand">Personal Expense Tracker</h1>
    </header>

    <header class="top-nav">
        <input type="checkbox" id="menu-toggle">

    <label for="menu-toggle" class="hamburger" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
    </label>

        <nav class="nav-links" aria-label="Main navigation">
            <a href="signup.html">Signup</a>
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="income.html">Income</a>
            <a href="add-expense.html">Add Expense</a>
            <a href="expenses.html">Expenses</a>
            <a href="categories.html">Categories</a>
            <a href="monthly-report.html">Monthly Report</a>
            <a href="logout.html">Logout</a>
            <a href="logout.html">Logout</a>
        </nav>
    </header>

    <main class="container">
        <div class="page-shell">

            <div class="dashboard-grid">
                <section class="panel">
                    <h2>Add Income</h2>
                    <form>
                        <label for="income-source">Source</label>
                        <input id="income-source" type="text" name="source" placeholder="Salary, Freelance, Bonus" required>

                        <label for="income-amount">Amount</label>
                        <input id="income-amount" type="number" name="amount" step="0.01" min="0" placeholder="0.00" required>

                        <label for="income-date">Date</label>
                        <input id="income-date" type="date" name="income_date" required>

                        <button type="submit">Add Income</button>
                    </form>
                </section>

                <section class="panel">
                    <h2>Income List</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Source</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Salary</td>
                                <td>Rs. 40,000.00</td>
                                <td>2026-10-01</td>
                                <td class="table-actions">
                                    <a href="income.html" class="button small-btn edit-btn">Edit</a>
                                    <button type="button" class="small-btn delete-btn">Delete</button>
                                </td>
                            </tr>
                            <tr>
                                <td>Freelance</td>
                                <td>Rs. 10,000.00</td>
                                <td>2026-10-05</td>
                                <td class="table-actions">
                                    <a href="income.html" class="button small-btn edit-btn">Edit</a>
                                    <button type="button" class="small-btn delete-btn">Delete</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
